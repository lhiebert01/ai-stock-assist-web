        <h1>AI Stock Assist — AI-Powered Stock Analysis</h1>
        <p>AI Stock Assist delivers professional stock analysis in under 30 seconds using Google Gemini AI. It evaluates 50+ fundamental metrics across cash flow, earnings quality, and valuation, then returns a data-driven BUY, HOLD, or SELL recommendation. Founded by Lindsay Hiebert.</p>

        <section>
          <h2>What AI Stock Assist does</h2>
          <ul>
            <li>Fundamental analysis across 50+ financial metrics (cash flow, balance sheet, valuation).</li>
            <li>AI-powered BUY / HOLD / SELL recommendations from real financial data sourced from Yahoo Finance.</li>
            <li>Two methodologies: Graham Value investing (conservative, margin-of-safety) and Growth &amp; Quality (cash-flow focused).</li>
            <li>Stock discovery across curated categories, and analysis of up to 10 stocks at once.</li>
            <li>Export any analysis as a formatted Word document.</li>
          </ul>
        </section>

        <section>
          <h2>Two investment methodologies</h2>
          <h3>Graham Value</h3>
          <p>For conservative, long-term value investors. Screens on P/E &lt; 15, P/B &lt; 1.5, Current Ratio &gt; 2.0, 20+ years of dividend history, and price below the Graham Number (margin of safety).</p>
          <h3>Growth &amp; Quality</h3>
          <p>For growth-oriented investors focused on cash flow. Screens on FCF Yield &gt; 5%, P/FCF &lt; 20, OCF/NI &gt; 1.0 (earnings quality), ROE &gt; 15%, and profit margin &gt; 10%.</p>
        </section>

        <section>
          <h2>Pricing</h2>
          <p>New accounts receive 3 free analyses, no credit card required. After that, analysis packs start at $4.99 for 20 analyses (about $0.25 each). No subscription — buy only what you need.</p>
        </section>

        <section>
          <h2>Frequently asked questions</h2>
          <h3>Is AI Stock Assist free?</h3>
          <p>You get 3 free analyses when you sign up. After that, purchase analysis packs starting at $4.99 for 20 analyses.</p>
          <h3>What AI model powers the analysis?</h3>
          <p>Google Gemini 3.1 Pro for primary analysis, with Groq Llama 3.3 70B as a reliable backup for 99.9% uptime.</p>
          <h3>How accurate are the recommendations?</h3>
          <p>The AI analyzes real financial data from Yahoo Finance — cash flow, balance sheet, and valuation metrics. Recommendations are data-driven, not predictions. Always do your own due diligence.</p>
          <h3>Can I export my analysis?</h3>
          <p>Yes. Export any analysis as a formatted Word document with all metrics, charts, and AI recommendations included.</p>
