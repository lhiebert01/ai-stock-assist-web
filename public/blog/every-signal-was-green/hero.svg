  <line x1="90" y1="220" x2="1110" y2="220" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="7 7"/><text x="1118" y="225" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#64748b">-20%</text>
  <line x1="90" y1="270" x2="1110" y2="270" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="7 7"/><text x="1118" y="275" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#64748b">-30%</text>
  <line x1="90" y1="320" x2="1110" y2="320" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="7 7"/><text x="1118" y="325" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#64748b">-40%</text>
  <line x1="90" y1="370" x2="1110" y2="370" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 7"/><text x="1118" y="375" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#94a3b8">-50%</text>
  <line x1="90" y1="470" x2="1110" y2="470" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 6"/><text x="1118" y="475" font-family="DejaVu Sans Mono, monospace" font-size="17" fill="#ef4444">-70%</text>

  <!-- 50% cushion band annotation -->
  <text x="90" y="362" font-family="DejaVu Sans Mono, monospace"
