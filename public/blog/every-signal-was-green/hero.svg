  <!-- the dive -->
  <path d="M 110 120 L 192 140 L 253 220 L 304 200 L 376 270 L 427 250 L 508 320 L 559 300 L 641 370 L 682 355 L 763 408" fill="none" stroke="#ef4444" stroke-width="5"
        stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 763 408 L 886 450 L 988 470 L 1079 445" fill="none" stroke="#ef4444" stroke-width="3.5"
        stroke-dasharray="9 8" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
  
<g transform="translate(146 132) rotate(30)">
  <path d="M 54 0 L -10 -16 L 6 0 L -10 16 Z" fill="#94a3b8"/>
  <path d="M 54 0 L 6 0 L 2 10 Z" fill="#64748b"/>
</g>
  
<g transform="translate(763 408)">
  <circle r="26" fill="#0a0e1a" stroke="#22d3ee" stroke-width="2.5"/>
  <!-- seat: L-shaped chair -->
  <path d="M -8 12 L -8 -6 L 8 -6" stroke="#22d3ee" stroke-width="4.5"
