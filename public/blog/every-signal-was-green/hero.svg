<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0a0e1a"/>
  <line x1="218" y1="102" x2="218" y2="534" stroke="#1e293b" stroke-width="1" opacity="0.55"/><line x1="345" y1="102" x2="345" y2="534" stroke="#1e293b" stroke-width="1" opacity="0.55"/><line x1="472" y1="102" x2="472" y2="534" stroke="#1e293b" stroke-width="1" opacity="0.55"/><line x1="600" y1="102" x2="600" y2="534" stroke="#1e293b" stroke-width="1" opacity="0.55"/><line x1="728" y1="102" x2="728" y2="534" stroke="#1e293b" stroke-width="1" opacity="0.55"/><line x1="855" y1="102" x2="855" y2="534" stroke="#1e293b" stroke-width="1" opacity="0.55"/><line x1="982" y1="102" x2="982" y2="534" stroke="#1e293b" stroke-width="1" opacity="0.55"/>

  <!-- signal row -->
  <circle cx="121" cy="62" r="7" fill="#22c55e"/><circle cx="147" cy="62" r="7" fill="#22c55e"/><circle cx="173" cy="62" r="7" fill="#22c55e"/><circle cx="199" cy="62" r="7" fill="#22c55e"/><circle cx="225" cy="62" r="7" fill="#22c55e"/>
  <text x="259" y="68" font-family="DejaVu Sans Mono, monospace"
