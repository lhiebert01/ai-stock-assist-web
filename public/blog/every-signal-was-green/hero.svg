</g>
<text x="799" y="390" font-family="DejaVu Sans Mono, monospace"
      font-size="19" font-weight="bold" fill="#22d3ee">EJECT: -55&#8211;60%</text>

  <!-- footer line -->
  <rect x="0" y="568" width="1200" height="62" fill="#151d35"/>
  <text x="600" y="606" text-anchor="middle"
        font-family="DejaVu Sans Mono, monospace" font-size="24" letter-spacing="3"
        fill="#f1f5f9">MY 50% CUSHION MET A 70% FLOOR</text>
